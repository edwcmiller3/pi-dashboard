<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pi Dashboard</title>
<!-- Cascade order matters: base < pack < layout < theme. -->
<!-- Base: reset, :root palette vars, canvas sizing. -->
<link rel="stylesheet" href="style.css" />
<!-- Icon pack (ICON_PACK): draws the glyphs the layout then sizes/colors. -->
<link rel="stylesheet" href="pack.css" />
<!-- Layout (LAYOUT): overrides/extends the base. -->
<link rel="stylesheet" href="layout.css" />
<!-- Theme (THEME): palette override, empty when unset; last so its :root wins. -->
<link rel="stylesheet" href="theme.css" />
</head>
<body>
  <!-- The layout builds its whole DOM into #app. Designed for the 1280x800
       effective viewport (scale 1.5). -->
  <div id="app"></div>
  <!-- Admin overlay (#admin route); app.js lazy-loads it on first open. -->
  <div id="admin-root" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
