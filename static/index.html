<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pi Dashboard</title>
<!-- Self-hosted, subset weather-icons font (no CDN — prod requirement). -->
<link rel="stylesheet" href="vendor/weather-icons/weather-icons.css" />
<!-- TRUE base: reset, :root palette vars, canvas sizing. -->
<link rel="stylesheet" href="style.css" />
<!-- Layout CSS: the selected layout's own rules, served by the /layout.css
     route (LAYOUT setting; classic by default). Loaded BETWEEN style.css and
     theme.css so the cascade is base < layout < theme — a layout overrides/
     extends the base (e.g. .screen), a theme's :root block still wins. -->
<link rel="stylesheet" href="layout.css" />
<!-- Palette override (THEME setting): the server serves the configured
     static/themes/<name>.css here, or empty CSS when unset. Loaded LAST so its
     :root block wins the cascade (base < layout < theme). -->
<link rel="stylesheet" href="theme.css" />
</head>
<body>
  <!-- The layout owns its whole DOM: app.js imports the core state machine + the
       classic layout, whose mount() builds the shell into #app and whose render
       hooks fill every region from /api/data. Designed for the 1280x800
       effective viewport (scale 1.5). -->
  <div id="app"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
