<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi-dashboard admin mock — soft scandi (warm Scandinavian light mode)</title>
<!-- Admin screen in the soft-scandi idiom: warm linen canvas, Fraunces display
     type, muted sage / terracotta / dusty-blue palette, soft rounded cards —
     matched to its dashboard sibling (soft-scandi.html). Theme-aware AND
     layout-skinned per the 2026-10-04 reversal. Fixture = CONTENT.md Admin section.
     Structure/markup/behaviour are identical to admin-dark-bento.html; only the
     styling differs. LIGHT idiom: live=terracotta, staged=dusty-blue, warn=rust.
     Storyboard: five framed states; frame 1 (resting/nominal) is the gallery view. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Nunito+Sans:ital,opsz,wght@0,6..12,400..800;1,6..12,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    /* warm linen base (shared with soft-scandi.html) */
    --linen-hi: #FAF6EC;
    --linen-lo: #F3ECDD;
    --card: #FFFEFA;
    --tile: #F6F0E3;
    --hairline: #EAE2D2;
    /* ink */
    --ink: #413B31;
    --muted: #8A8171;
    --faint: #A99F8D;
    /* muted natural palette */
    --sage: #7E9370;
    --sage-milk: #EAEFE2;
    --terracotta: #BC6B4C;
    --terracotta-ink: #8F4F35;
    --terracotta-milk: #F7E6DC;
    --dusty: #7C99AE;
    --dusty-ink: #3F576B;
    --dusty-milk: #E7EDF1;
    --ochre: #B98A34;
    /* alarm — a deeper, more saturated rust, distinct from the terracotta accent */
    --alarm: #B5392C;
    --alarm-milk: #F4DAD2;
    --shadow: 0 14px 34px rgba(96, 78, 54, 0.08), 0 3px 8px rgba(96, 78, 54, 0.05);
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: #E6DFD2;
    color: var(--ink);
    font-family: 'Nunito Sans', system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    gap: 2.2rem; padding: 40px 20px 72px;
  }
  .page-head { max-width: 80rem; width: 100%; }
  .page-head h1 { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 560; color: #2f2a22; }
  .page-head p { color: #6f675a; font-size: 13.5px; margin-top: 4px; max-width: 72ch; }

  /* storyboard frame chrome (mock-only, outside the 1280×800 canvas) */
  .frame { display: flex; flex-direction: column; gap: 10px; }
  .frame figcaption { color: #6f675a; font-size: 13px; letter-spacing: 0.02em; }
  .frame figcaption b { color: #413B31; font-weight: 700; }
  .frame figcaption code { background: #ded5c4; border-radius: 4px; padding: 1px 5px; font-size: 12px; }

  .screen {
    width: 80rem; height: 50rem; position: relative; overflow: hidden;
    background: linear-gradient(178deg, var(--linen-hi) 0%, var(--linen-lo) 100%);
    border-radius: 14px;
    box-shadow: 0 30px 70px rgba(80, 62, 40, 0.22), 0 4px 14px rgba(80, 62, 40, 0.12);
    display: grid; grid-template-rows: auto 1fr; gap: 1.1rem; padding: 1.4rem 1.5rem;
  }
  .card {
    background: var(--card); border-radius: 1.5rem; box-shadow: var(--shadow);
    padding: 1.3rem 1.5rem; display: flex; flex-direction: column; min-height: 0;
  }
  .card > h2 { font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--faint); font-weight: 800; margin-bottom: 1.1rem; display: flex;
    align-items: center; gap: 0.5rem; }
  .card > h2 svg { width: 1rem; height: 1rem; stroke: var(--sage); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- header: back arrow + title ---- */
  .ahead { display: flex; align-items: center; gap: 0.9rem; padding: 0.1rem 0.3rem; }
  .back { display: inline-flex; align-items: center; justify-content: center;
    width: 2.7rem; height: 2.7rem; border-radius: 999px; cursor: pointer;
    background: var(--card); border: 1px solid var(--hairline); box-shadow: var(--shadow); color: var(--ink); }
  .back:hover { border-color: var(--sage); }
  .back svg { width: 1.4rem; height: 1.4rem; stroke: var(--sage); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .ahead .title { font-family: 'Fraunces', serif; font-size: 1.9rem; font-weight: 560; letter-spacing: -0.01em; }

  /* ---- body grid: config (left) + right column ---- */
  .abody { display: grid; grid-template-columns: 1.5fr 1fr; gap: 1.1rem; min-height: 0; }
  .col-right { display: flex; flex-direction: column; gap: 1.1rem; min-height: 0; }

  /* ---- config knobs ---- */
  .knob { padding: 0.95rem 0; }
  .knob + .knob { border-top: 1px solid var(--hairline); }
  .knob-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 0.7rem; }
  .knob-name { font-family: 'Fraunces', serif; font-size: 1.35rem; font-weight: 560; }
  .knob-live { color: var(--faint); font-size: 0.78rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
  .knob-live b { color: var(--muted); font-weight: 800; }
  .opts { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .opt { font-size: 0.98rem; font-weight: 700; padding: 0.4rem 0.9rem; border-radius: 999px;
    border: 1px solid var(--hairline); background: #FDFBF5; color: var(--muted); font-variant-numeric: tabular-nums; }
  /* live/current value — terracotta accent */
  .opt.is-current { color: var(--terracotta-ink); border-color: var(--terracotta);
    background: var(--terracotta-milk); font-weight: 800; }
  /* when a different value is staged, the live one de-emphasizes to an outline */
  .opt.was-current { color: var(--muted); border-color: color-mix(in srgb, var(--terracotta) 50%, var(--hairline));
    background: #FDFBF5; }
  /* staged (pending apply) — dusty-blue, clearly distinct from the terracotta live */
  .opt.is-staged { color: var(--dusty-ink); border-color: var(--dusty);
    background: var(--dusty-milk); font-weight: 800; }

  /* ---- apply bar ---- */
  .apply-bar { margin-top: auto; padding-top: 1.1rem; border-top: 1px solid var(--hairline);
    display: flex; align-items: center; justify-content: space-between; }
  .apply-summary { color: var(--faint); font-size: 1rem; font-weight: 700; }
  .apply-summary.has-staged { color: var(--dusty-ink); font-weight: 800; }
  .apply-btn { font-size: 1.02rem; font-weight: 800; padding: 0.6rem 1.5rem; border-radius: 999px;
    border: 1px solid transparent; cursor: pointer; }
  .apply-btn.is-off { color: var(--faint); background: var(--tile); border-color: var(--hairline); cursor: default; }
  .apply-btn.is-on { color: #FFFDF8; background: var(--terracotta); box-shadow: 0 6px 16px rgba(188, 107, 76, 0.28); }

  /* ---- device health ---- */
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 0.95rem 1.4rem; }
  .metric .k { display: flex; align-items: center; gap: 0.35rem; color: var(--faint);
    font-size: 0.7rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.2rem; }
  .metric .k svg { width: 0.9rem; height: 0.9rem; stroke: var(--muted); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .metric .v { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 560; font-variant-numeric: tabular-nums; }
  .metric .v small { font-family: 'Nunito Sans', sans-serif; font-size: 0.9rem; color: var(--muted); font-weight: 700; }
  .metric.wide { grid-column: 1 / -1; }
  .metric.is-warn .v { color: var(--alarm); }
  .metric.is-warn .k svg { stroke: var(--alarm); }
  .flags { display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem; margin-top: 0.25rem; }
  .flag { font-size: 0.84rem; padding: 0.22rem 0.65rem; border-radius: 999px; font-weight: 800; }
  .flag.ok { color: var(--sage); background: var(--sage-milk); }
  .flag.bad { color: var(--alarm); background: var(--alarm-milk); }
  .flag.muted { color: var(--faint); background: none; font-weight: 700; }
  .hex { color: var(--faint); font-size: 0.84rem; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ---- device actions ---- */
  .actions { display: flex; flex-direction: column; gap: 0.8rem; }
  .act { display: flex; align-items: center; gap: 0.9rem; text-align: left; cursor: pointer;
    padding: 1rem 1.1rem; border-radius: 1rem; background: var(--tile);
    border: 1px solid var(--hairline); color: var(--ink); }
  .act:hover { border-color: var(--sage); }
  .act .ico { display: inline-flex; width: 2.4rem; height: 2.4rem; flex: none; border-radius: 999px;
    align-items: center; justify-content: center; background: var(--sage-milk); }
  .act .ico svg { width: 1.25rem; height: 1.25rem; stroke: var(--sage); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .act .lbl { font-size: 1.15rem; font-weight: 800; }
  .act.danger .ico { background: var(--alarm-milk); }
  .act.danger .ico svg { stroke: var(--alarm); }
  .act.danger:hover { border-color: var(--alarm); }

  /* ---- overlay scrim (shared by confirm dialog + transition) — warm dim ---- */
  .scrim { position: absolute; inset: 0; background: rgba(63, 54, 42, 0.52);
    display: flex; align-items: center; justify-content: center; }

  /* ---- confirm dialog (solid) ---- */
  .dialog { width: 30rem; padding: 1.9rem 1.9rem 1.5rem; background: var(--card);
    border-radius: 1.5rem; box-shadow: 0 30px 70px rgba(50, 38, 24, 0.4); }
  .dialog .dico { width: 3rem; height: 3rem; border-radius: 999px; display: inline-flex;
    align-items: center; justify-content: center; margin-bottom: 1rem; background: var(--alarm-milk); }
  .dialog .dico svg { width: 1.6rem; height: 1.6rem; stroke: var(--alarm); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dialog h3 { font-family: 'Fraunces', serif; font-size: 1.6rem; font-weight: 580; margin-bottom: 0.5rem; }
  .dialog p { color: var(--muted); font-size: 1.05rem; font-weight: 600; line-height: 1.45; }
  .dialog .btns { display: flex; justify-content: flex-end; gap: 0.7rem; margin-top: 1.6rem; }
  .dbtn { font-size: 1.02rem; font-weight: 800; padding: 0.6rem 1.4rem; border-radius: 999px; cursor: pointer; }
  .dbtn.ghost { color: var(--muted); background: var(--card); border: 1px solid var(--hairline); }
  .dbtn.ghost:hover { border-color: var(--muted); }
  .dbtn.danger { color: #FFFDF8; background: var(--alarm); border: 1px solid transparent;
    box-shadow: 0 6px 16px rgba(181, 57, 44, 0.3); }

  /* ---- transition state (Apply / Restart — the window Chromium stays alive) ---- */
  .terminal { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; text-align: center; }
  .terminal .spin { width: 3.4rem; height: 3.4rem; border-radius: 50%;
    border: 3px solid rgba(255, 253, 248, 0.25); border-top-color: #FFFDF8; }
  .terminal .big { font-family: 'Fraunces', serif; font-size: 2.1rem; font-weight: 580; color: #FFFDF8; }
  .terminal .small { color: rgba(255, 253, 248, 0.82); font-size: 1.15rem; font-weight: 600; }
</style>
</head>
<body>
<div class="page-head">
  <h1>Admin screen — soft scandi (the <code>soft-scandi</code> layout)</h1>
  <p>The Admin screen rendered in the warm Scandinavian light idiom (theme-aware AND
  layout-skinned). Frame 1 is the canonical resting view; frames 2–5 document the
  staged-apply, confirm, transition, and degraded-health states. Fixture: CONTENT.md.</p>
</div>

<!-- ============================================================= -->
<!-- FRAME 1 — resting, nominal health                              -->
<!-- ============================================================= -->
<figure class="frame">
  <figcaption><b>1 · Resting</b> — nominal health · nothing staged · Apply inactive</figcaption>
  <div class="screen">

    <div class="ahead">
      <button class="back" type="button" aria-label="Back to dashboard" title="Back to dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <span class="title">Admin</span>
    </div>

    <div class="abody">

      <!-- CONFIG -->
      <div class="card">
        <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h7"/></svg>Appearance</h2>

        <div class="knob">
          <div class="knob-top"><span class="knob-name">Layout</span><span class="knob-live">Live: <b>soft-scandi</b></span></div>
          <div class="opts">
            <span class="opt">classic</span>
            <span class="opt">hud</span>
            <span class="opt">swiss-mono</span>
            <span class="opt">paper-editorial</span>
            <span class="opt">neo-brutalist</span>
            <span class="opt is-current">soft-scandi</span>
          </div>
        </div>

        <div class="knob">
          <div class="knob-top"><span class="knob-name">Theme</span><span class="knob-live">Live: <b>default</b></span></div>
          <div class="opts">
            <span class="opt is-current">default</span>
            <span class="opt">catppuccin</span>
            <span class="opt">gruvbox</span>
            <span class="opt">nord</span>
            <span class="opt">synthwave</span>
          </div>
        </div>

        <div class="knob">
          <div class="knob-top"><span class="knob-name">Icon pack</span><span class="knob-live">Live: <b>weather-icons</b></span></div>
          <div class="opts">
            <span class="opt is-current">weather-icons</span>
            <span class="opt">meteocons</span>
            <span class="opt">meteocons-flat</span>
            <span class="opt">meteocons-line</span>
            <span class="opt">meteocons-mono</span>
          </div>
        </div>

        <div class="apply-bar">
          <span class="apply-summary">No changes staged</span>
          <button class="apply-btn is-off" type="button">Apply</button>
        </div>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="col-right">

        <!-- DEVICE HEALTH (nominal) -->
        <div class="card" style="flex:1">
          <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg>Device health</h2>
          <div class="metrics">
            <div class="metric"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>CPU</div><div class="v">22%</div></div>
            <div class="metric"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="9" rx="1.5"/><path d="M7 17v3M12 17v3M17 17v3"/></svg>RAM</div><div class="v">1.4<small> / 3.8 GB</small></div></div>
            <div class="metric"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg>Temp</div><div class="v">48.3<small> °C</small></div></div>
            <div class="metric"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 20V9h10v11M10 13h.01"/></svg>Disk (SD)</div><div class="v">4.1<small> / 29 GB</small></div></div>
            <div class="metric"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Uptime</div><div class="v">8h 46m</div></div>
            <div class="metric"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg>Host</div><div class="v" style="font-size:1.2rem">raspberrypi</div></div>
            <div class="metric wide"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>Throttle</div><div class="flags"><span class="flag ok">No throttling</span><span class="hex">0x0</span></div></div>
            <div class="metric wide"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9a16 16 0 0 1 20 0M5 13a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r="0.6"/></svg>Network</div><div class="v" style="font-size:1.25rem">192.168.1.42 <small>/24 · wlan0</small></div></div>
          </div>
        </div>

        <!-- DEVICE ACTIONS -->
        <div class="card">
          <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>Device</h2>
          <div class="actions">
            <button class="act" type="button">
              <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v4h-4"/></svg></span>
              <span class="lbl">Restart dashboard</span>
            </button>
            <button class="act danger" type="button">
              <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg></span>
              <span class="lbl">Reboot Pi</span>
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</figure>

<!-- ============================================================= -->
<!-- FRAME 2 — config staged (Theme → nord), Apply active           -->
<!-- ============================================================= -->
<figure class="frame">
  <figcaption><b>2 · Config staged</b> — Theme changed to <code>nord</code> · Apply active (writes .env + restarts once)</figcaption>
  <div class="screen">

    <div class="ahead">
      <button class="back" type="button" aria-label="Back to dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
      <span class="title">Admin</span>
    </div>

    <div class="abody">
      <div class="card">
        <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h7"/></svg>Appearance</h2>

        <div class="knob">
          <div class="knob-top"><span class="knob-name">Layout</span><span class="knob-live">Live: <b>soft-scandi</b></span></div>
          <div class="opts">
            <span class="opt">classic</span>
            <span class="opt">hud</span>
            <span class="opt">swiss-mono</span>
            <span class="opt">paper-editorial</span>
            <span class="opt">neo-brutalist</span>
            <span class="opt is-current">soft-scandi</span>
          </div>
        </div>

        <div class="knob">
          <div class="knob-top"><span class="knob-name">Theme</span><span class="knob-live">Live: <b>default</b></span></div>
          <div class="opts">
            <span class="opt was-current">default</span>
            <span class="opt">catppuccin</span>
            <span class="opt">gruvbox</span>
            <span class="opt is-staged">nord</span>
            <span class="opt">synthwave</span>
          </div>
        </div>

        <div class="knob">
          <div class="knob-top"><span class="knob-name">Icon pack</span><span class="knob-live">Live: <b>weather-icons</b></span></div>
          <div class="opts">
            <span class="opt is-current">weather-icons</span>
            <span class="opt">meteocons</span>
            <span class="opt">meteocons-flat</span>
            <span class="opt">meteocons-line</span>
            <span class="opt">meteocons-mono</span>
          </div>
        </div>

        <div class="apply-bar">
          <span class="apply-summary has-staged">1 change staged</span>
          <button class="apply-btn is-on" type="button">Apply</button>
        </div>
      </div>

      <div class="col-right">
        <div class="card" style="flex:1">
          <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg>Device health</h2>
          <div class="metrics">
            <div class="metric"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>CPU</div><div class="v">22%</div></div>
            <div class="metric"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="9" rx="1.5"/><path d="M7 17v3M12 17v3M17 17v3"/></svg>RAM</div><div class="v">1.4<small> / 3.8 GB</small></div></div>
            <div class="metric"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg>Temp</div><div class="v">48.3<small> °C</small></div></div>
            <div class="metric"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 20V9h10v11M10 13h.01"/></svg>Disk (SD)</div><div class="v">4.1<small> / 29 GB</small></div></div>
            <div class="metric"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Uptime</div><div class="v">8h 46m</div></div>
