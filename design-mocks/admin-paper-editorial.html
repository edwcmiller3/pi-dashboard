<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi-dashboard admin mock — paper editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<!-- Admin screen in the `paper-editorial` (warm-paper broadsheet) idiom, matching
     its dashboard sibling (paper-editorial.html): paper sheet + grain + printed
     border, Playfair/Newsreader serif, ink hairlines, one oxblood accent. Same
     structure + behavior as the reference admin mock (admin-dark-bento.html);
     only the styling is the broadsheet language. Theme-aware AND layout-skinned.
     Fixture = CONTENT.md Admin section. Storyboard: five framed states. -->
<style>
  :root {
    --paper:   #faf7f0;
    --ink:     #1d1a15;
    --ink-60:  #55503f;
    --ink-40:  #8a8372;
    --hair:    rgba(29, 26, 21, 0.38);
    --hair-lt: rgba(29, 26, 21, 0.18);
    --ink-tint: rgba(29, 26, 21, 0.06);
    --oxblood: #7d2b23;
    --serif-display: "Playfair Display", "Georgia", serif;
    --serif-text: "Newsreader", "Georgia", serif;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: #cfc9bc;
    color: var(--ink);
    font-family: var(--serif-text);
    display: flex; flex-direction: column; align-items: center;
    gap: 2.2rem; padding: 40px 20px 72px;
  }
  .page-head { max-width: 80rem; width: 100%; }
  .page-head h1 { font-family: var(--serif-display); font-size: 22px; font-weight: 600; color: #2a271f; }
  .page-head p { color: #4a4537; font-size: 13.5px; margin-top: 5px; max-width: 72ch; }

  /* storyboard frame chrome (mock-only, outside the 1280×800 canvas) */
  .frame { display: flex; flex-direction: column; gap: 10px; }
  .frame figcaption { color: #4a4537; font-size: 13px; letter-spacing: 0.02em; }
  .frame figcaption b { color: #211e18; font-weight: 600; }

  /* the sheet */
  .screen {
    width: 80rem; height: 50rem; position: relative; overflow: hidden;
    background: var(--paper); color: var(--ink);
    padding: 1.6rem 2.6rem 1.4rem;
    display: flex; flex-direction: column;
  }
  .screen::after { /* faint paper grain */
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.035;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }
  .screen::before { /* printed page border */
    content: ""; position: absolute; inset: 10px; border: 1px solid var(--hair-lt); pointer-events: none;
  }

  .rule-double { border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink); height: 6px; margin: 0.9rem 0 1.1rem; }

  /* ---- header: back arrow + title ---- */
  .ahead { display: flex; align-items: center; gap: 1rem; padding: 0.2rem 0.1rem 0; }
  .back { display: inline-flex; align-items: center; justify-content: center;
    width: 2.6rem; height: 2.6rem; cursor: pointer;
    background: none; border: 1px solid var(--hair); color: var(--ink); }
  .back:hover { color: var(--oxblood); border-color: var(--oxblood); }
  .back svg { width: 1.4rem; height: 1.4rem; stroke: currentColor; fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .ahead .title { font-family: var(--serif-display); font-size: 2rem; font-weight: 600; letter-spacing: 0.01em; }

  /* ---- body grid ---- */
  .abody { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.5fr 1fr; gap: 1.6rem; }
  .col-right { display: flex; flex-direction: column; gap: 1.6rem; min-height: 0; }
  .card { border: 1px solid var(--hair); padding: 1.2rem 1.4rem; display: flex; flex-direction: column; min-height: 0; }
  .card > h2 { font-family: var(--serif-text); font-size: 0.8rem; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--ink); font-weight: 600; display: flex; align-items: center;
    gap: 0.5rem; padding-bottom: 0.7rem; margin-bottom: 1rem; border-bottom: 1px solid var(--hair); }
  .card > h2 svg { width: 1rem; height: 1rem; stroke: currentColor; fill: none;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- config knobs ---- */
  .knob { padding: 0.85rem 0; }
  .knob + .knob { border-top: 1px solid var(--hair-lt); }
  .knob-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 0.65rem; }
  .knob-name { font-family: var(--serif-display); font-size: 1.25rem; font-weight: 600; }
  .knob-live { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-40); }
  .knob-live b { color: var(--ink-60); font-weight: 600; }
  .opts { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .opt { font-size: 0.95rem; padding: 0.35rem 0.8rem; border: 1px solid var(--hair-lt);
    color: var(--ink-60); background: none; font-variant-numeric: tabular-nums; }
  /* live/current value — quiet ink box */
  .opt.is-current { color: var(--ink); border-color: var(--ink); background: var(--ink-tint); font-weight: 600; }
  /* when a change is staged, the live value de-emphasizes */
  .opt.was-current { color: var(--ink-60); border-color: var(--hair); background: none; }
  /* staged (pending apply) — the one oxblood block: colour alone signals it */
  .opt.is-staged { color: var(--paper); background: var(--oxblood); border-color: var(--oxblood); font-weight: 600; }

  /* ---- apply bar ---- */
  .apply-bar { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--hair);
    display: flex; align-items: center; justify-content: space-between; }
  .apply-summary { color: var(--ink-40); font-size: 0.98rem; font-style: italic; }
  .apply-summary.has-staged { color: var(--oxblood); font-style: normal; font-weight: 600; }
  .apply-btn { font-family: var(--serif-text); font-size: 0.9rem; letter-spacing: 0.16em;
    text-transform: uppercase; font-weight: 600; padding: 0.6rem 1.4rem; border: 1px solid; cursor: pointer; }
  .apply-btn.is-off { color: var(--ink-40); background: none; border-color: var(--hair-lt); cursor: default; }
  .apply-btn.is-on { color: var(--paper); background: var(--oxblood); border-color: var(--oxblood); }

  /* ---- device health ---- */
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem 1.4rem; }
  .metric .k { display: flex; align-items: center; gap: 0.35rem; color: var(--ink-40);
    font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 0.2rem; }
  .metric .k svg { width: 0.9rem; height: 0.9rem; stroke: var(--ink-60); fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .metric .v { font-family: var(--serif-display); font-size: 1.5rem; font-weight: 500; font-variant-numeric: tabular-nums; }
  .metric .v small { font-family: var(--serif-text); font-size: 0.9rem; color: var(--ink-60); font-weight: 400; }
  .metric.wide { grid-column: 1 / -1; }
  .metric.is-warn .v { color: var(--oxblood); }
  .metric.is-warn .k svg { stroke: var(--oxblood); }
  .flags { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin-top: 0.2rem; }
  .flag { font-size: 0.8rem; padding: 0.15rem 0.55rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .flag.ok { color: var(--ink-60); border: 1px solid var(--hair-lt); }
  .flag.bad { color: var(--paper); background: var(--oxblood); }
  .flag.muted { color: var(--ink-40); font-weight: 400; letter-spacing: 0; text-transform: none; font-style: italic; }
  .hex { color: var(--ink-40); font-size: 0.82rem; font-variant-numeric: tabular-nums; }

  /* ---- device actions ---- */
  .actions { display: flex; flex-direction: column; gap: 0.7rem; }
  .act { display: flex; align-items: center; gap: 0.9rem; text-align: left; cursor: pointer;
    padding: 0.9rem 1rem; background: none; border: 1px solid var(--hair); color: var(--ink); }
  .act:hover { border-color: var(--ink); }
  .act .ico { display: inline-flex; width: 2.2rem; height: 2.2rem; flex: none;
    align-items: center; justify-content: center; border: 1px solid var(--hair-lt); }
  .act .ico svg { width: 1.2rem; height: 1.2rem; stroke: var(--ink-60); fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .act .lbl { font-family: var(--serif-display); font-size: 1.15rem; font-weight: 600; }
  .act.danger .ico { border-color: color-mix(in srgb, var(--oxblood) 45%, transparent); }
  .act.danger .ico svg { stroke: var(--oxblood); }
  .act.danger .lbl { color: var(--oxblood); }
  .act.danger:hover { border-color: var(--oxblood); }

  /* ---- overlay scrim ---- */
  .scrim { position: absolute; inset: 0; background: rgba(29, 26, 21, 0.55);
    display: flex; align-items: center; justify-content: center; z-index: 2; }
  .scrim.load { background: rgba(250, 247, 240, 0.92); }

  /* ---- confirm dialog (solid paper, not translucent) ---- */
  .dialog { width: 30rem; padding: 1.8rem 1.8rem 1.5rem; background: var(--paper);
    border: 1px solid var(--ink); border-top: 4px solid var(--oxblood);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4); }
  .dialog .dico { width: 3rem; height: 3rem; display: inline-flex; align-items: center;
    justify-content: center; margin-bottom: 1rem; border: 1px solid var(--oxblood); color: var(--oxblood); }
  .dialog .dico svg { width: 1.6rem; height: 1.6rem; stroke: currentColor; fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .dialog h3 { font-family: var(--serif-display); font-size: 1.7rem; font-weight: 600; margin-bottom: 0.5rem; }
  .dialog p { color: var(--ink-60); font-size: 1.05rem; line-height: 1.5; }
  .dialog .btns { display: flex; justify-content: flex-end; gap: 0.7rem; margin-top: 1.6rem; }
  .dbtn { font-family: var(--serif-text); font-size: 0.9rem; letter-spacing: 0.16em;
    text-transform: uppercase; font-weight: 600; padding: 0.6rem 1.3rem; border: 1px solid; cursor: pointer; }
  .dbtn.ghost { color: var(--ink-60); background: none; border-color: var(--hair); }
  .dbtn.danger { color: var(--paper); background: var(--oxblood); border-color: var(--oxblood); }

  /* ---- transition state (Apply / Restart dashboard) ---- */
  .terminal { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; text-align: center; }
  .terminal .spin { width: 3.2rem; height: 3.2rem; border-radius: 50%;
    border: 3px solid var(--hair-lt); border-top-color: var(--oxblood); }
  .terminal .big { font-family: var(--serif-display); font-size: 2rem; font-weight: 600; color: var(--ink); }
  .terminal .small { color: var(--ink-60); font-size: 1.15rem; font-style: italic; }
</style>
</head>
<body>
<div class="page-head">
  <h1>Admin screen — paper editorial</h1>
  <p>The Admin screen rendered in the warm-paper broadsheet idiom (theme-aware AND
  layout-skinned). Frame 1 is the canonical resting view; frames 2–5 document the
  staged-apply, confirm, transition, and degraded-health states. Fixture: CONTENT.md.</p>
</div>

<!-- ============================================================= -->
<!-- FRAME 1 — resting, nominal health                              -->
<!-- ============================================================= -->
<figure class="frame">
  <figcaption><b>1 · Resting</b> — nominal health · nothing staged · Apply inactive</figcaption>
  <div class="screen">

    <div class="ahead">
      <button class="back" type="button" aria-label="Back to dashboard" title="Back to dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <span class="title">Admin</span>
    </div>
    <div class="rule-double"></div>

    <div class="abody">

      <!-- CONFIG -->
      <div class="card">
        <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h7"/></svg>Appearance</h2>

        <div class="knob">
          <div class="knob-top"><span class="knob-name">Layout</span><span class="knob-live">Live: <b>paper-editorial</b></span></div>

            <span class="opt">classic</span>
            <span class="opt">hud</span>

          </div>
        </div>

            <span class="opt">catppuccin</span>

        </div>

        <div class="knob">
          <div class="knob-top"><span class="knob-name">Icon pack</span><span class="knob-live">Live: <b>weather-icons</b></span></div>
          <div class="opts">
            <span class="opt is-current">weather-icons</span>
            <span class="opt">meteocons</span>
            <span class="opt">meteocons-flat</span>
            <span class="opt">meteocons-line</span>
            <span class="opt">meteocons-mono</span>

        </div>

        <div class="apply-bar">
          <span class="apply-summary">No changes staged</span>
          <button class="apply-btn is-off" type="button">Apply</button>
        </div>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="col-right">

        <!-- DEVICE HEALTH (nominal) -->
        <div class="card" style="flex:1">
          <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg>Device health</h2>
          <div class="metrics">
            <div class="metric"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>CPU</div><div class="v">22%</div></div>
            <div class="metric"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="9" rx="1.5"/><path d="M7 17v3M12 17v3M17 17v3"/></svg>RAM</div><div class="v">1.4<small> / 3.8 GB</small></div></div>
            <div class="metric"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg>Temp</div><div class="v">48.3<small> °C</small></div></div>
            <div class="metric"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 20V9h10v11M10 13h.01"/></svg>Disk (SD)</div><div class="v">4.1<small> / 29 GB</small></div></div>
            <div class="metric"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Uptime</div><div class="v">8h 46m</div></div>
            <div class="metric"><div class="k"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg>Host</div><div class="v" style="font-size:1.2rem">raspberrypi</div></div>

          </div>
        </div>

        <!-- DEVICE ACTIONS -->
        <div class="card">
          <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>Device</h2>
          <div class="actions">
            <button class="act" type="button">
              <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v4h-4"/></svg></span>
              <span class="lbl">Restart dashboard</span>
            </button>
            <button class="act danger" type="button">
              <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg></span>
              <span class="lbl">Reboot Pi</span>
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</figure>
